# Trình soạn thảo của May — Pages CMS (app.pagescms.org)
# Đăng nhập bằng GitHub → chọn repo maybejoy → sửa chữ, đăng bài. Bấm Save là web tự cập nhật sau 1–2 phút.

media:
  input: src/assets/images
  output: /assets/images

content:
  # ---------- VIẾT ----------
  - name: nhat-ky
    label: "✏️ Từng chút một — trang ngắn (ghi chú, ảnh, câu tâm đắc)"
    type: collection
    path: src/nhat-ky
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [chu, kieu, tamTrang, date]
      primary: chu
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: date, label: Ngày, type: date, required: true }
      - name: kieu
        label: Kiểu trang
        type: select
        required: true
        options:
          values:
            - { value: ghi-chu, label: "Giấy note (chữ viết tay)" }
            - { value: anh, label: "Ảnh polaroid + một dòng" }
            - { value: cau, label: "Câu tâm đắc (nền đỏ đô)" }
      - name: tamTrang
        label: Ngày hôm nay…
        type: select
        required: true
        options:
          values:
            - { value: nhich, label: Nhích được }
            - { value: bo, label: Muốn bỏ }
            - { value: met, label: Mệt }
            - { value: vui, label: Vui ghê }
            - { value: hoc, label: Học một chút }
      - { name: chu, label: "Chữ (ngắn thôi — với ảnh thì là dòng chú thích)", type: text, required: true }
      - { name: anh, label: "Ảnh (chỉ cần khi chọn kiểu Ảnh)", type: image }
      - { name: moTaAnh, label: "Tả ảnh trong một câu (cho người khiếm thị và Google)", type: string }
      - { name: draft, label: Ẩn đi (chưa đăng), type: boolean, default: false }

  - name: bai-viet
    label: "📖 Bài viết dài"
    type: collection
    path: src/bai-viet
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, category, date, draft]
      primary: title
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Tiêu đề, type: string, required: true }
      - { name: date, label: Ngày đăng, type: date, required: true }
      - name: category
        label: Chuyên mục
        type: select
        required: true
        options:
          values:
            - { value: tung-chut-mot, label: Từng chút một }
            - { value: me-cung-dang-hoc, label: Mẹ cũng đang học }
      - name: tamTrang
        label: "Nhãn trên tường (chỉ cho Từng chút một)"
        type: select
        options:
          values:
            - { value: nhich, label: Nhích được }
            - { value: bo, label: Muốn bỏ }
            - { value: met, label: Mệt }
            - { value: vui, label: Vui ghê }
            - { value: hoc, label: Học một chút }
      - name: the
        label: "Thẻ (chỉ cho Mẹ cũng đang học — chọn 1 hoặc 2)"
        type: select
        options:
          multiple: true
          values:
            - { value: me-tho, label: "Mẹ thở đã" }
            - { value: con-gap-chuyen, label: "Con đang gặp chuyện gì?" }
            - { value: gan-nhau, label: "Gần nhau hơn" }
      - { name: excerpt, label: "Đoạn giới thiệu ngắn (hiện ở danh sách và trên Google)", type: text }
      - { name: image, label: Ảnh đầu bài, type: image }
      - { name: imageAlt, label: Tả ảnh trong một câu, type: string }
      - { name: thuToiNay, label: "Hộp 'thử tối nay' cuối bài (bỏ trống nếu không có)", type: text }
      - { name: noiBat, label: "Ghim làm bài nổi bật ở Mẹ cũng đang học", type: boolean, default: false }
      - { name: draft, label: Bản nháp (chưa đăng), type: boolean, default: false }
      - { name: body, label: Nội dung, type: rich-text }

  # ---------- CHỮ TRÊN CÁC TRANG ----------
  - name: trang-chu
    label: "🏠 Trang chủ (vở)"
    type: file
    path: src/_data/trangChu.json
    format: json
    fields:
      - name: nhan
        label: Nhãn vở (mỗi dòng một mục, thêm bớt tuỳ ý)
        type: object
        list: true
        fields:
          - { name: nhan, label: "Nhãn (vd: Môn giỏi)", type: string }
          - { name: giaTri, label: Nội dung, type: string }
      - { name: anhThe, label: Ảnh thẻ, type: image }
      - { name: anhTheMoTa, label: Tả ảnh thẻ, type: string }
      - { name: anhTheChuThich, label: Chú thích dưới ảnh thẻ, type: string }
      - { name: loiChao, label: Lời chào đầu vở, type: text }
      - name: viecDau
        label: Việc số 1 (đã tick sẵn)
        type: object
        fields:
          - { name: viec, label: Việc, type: string }
          - { name: ghiChu, label: Dòng nhỏ bên dưới, type: string }
      - name: viecChuyenMuc
        label: Bốn việc dẫn vào bốn chuyên mục
        type: object
        list: true
        fields:
          - name: chuyenMuc
            label: Dẫn tới chuyên mục
            type: select
            options:
              values:
                - { value: tung-chut-mot, label: Từng chút một }
                - { value: me-cung-dang-hoc, label: Mẹ cũng đang học }
                - { value: mot-chuyen-thoi-me, label: Một chuyện thôi mẹ! }
                - { value: o-xuong-may, label: Ở xưởng May }
          - { name: viec, label: Việc, type: string }
          - { name: ghiChu, label: Dòng nhỏ bên dưới, type: text }
          - { name: ghiLe, label: "Ghi chú ngoài lề đỏ (có thể bỏ trống)", type: string }
      - name: viecTheoDoi
        label: Việc 'theo dõi May'
        type: object
        fields:
          - { name: viec, label: Việc, type: string }
          - { name: ghiChu, label: Dòng nhỏ bên dưới, type: string }
      - name: baiTap
        label: Bài tập về nhà (cuốn nhỏ miễn phí)
        type: object
        fields:
          - { name: tenSach, label: Tên cuốn nhỏ, type: string }
          - { name: deBai, label: "Đề bài (*chữ nghiêng* đặt giữa hai dấu sao)", type: text }
      - name: thoiKhoaBieu
        label: Thời khoá biểu (mỗi dòng chỉ hiện khi đã có link mạng xã hội đó)
        type: object
        list: true
        fields:
          - { name: mon, label: Môn, type: string }
          - name: noi
            label: Lớp ở đâu
            type: select
            options: { values: [TikTok, Facebook, YouTube] }
          - { name: hoc, label: Học gì, type: string }

  - name: trang-tung-chut-mot
    label: "📄 Trang Từng chút một — chữ đầu trang"
    type: file
    path: src/_data/tungChutMot.json
    format: json
    fields:
      - { name: loiMoDau, label: Lời mở đầu, type: text }
      - { name: ghiLe, label: Câu viết tay bên phải, type: string }
      - { name: moiDangKy, label: Lời mời đăng ký email cuối trang, type: text }

  - name: trang-me
    label: "📄 Trang Mẹ cũng đang học — chữ và các chương"
    type: file
    path: src/_data/meCungDangHoc.json
    format: json
    fields:
      - { name: loiMoDau, label: Lời mở đầu, type: text }
      - name: cachDoc
        label: Ba lời hứa khi đọc
        type: object
        list: true
        fields:
          - { name: ten, label: Tên, type: string }
          - { name: moTa, label: Mô tả, type: string }
      - { name: tieuDeDanhSach, label: "Tiêu đề danh sách bài (*chữ nghiêng* giữa hai dấu sao)", type: string }
      - name: the
        label: "Ba thẻ (đổi tên, mô tả, ảnh thoải mái; đừng đổi ô Mã)"
        type: object
        list: true
        fields:
          - { name: key, label: "Mã (không dấu, khớp với ô Thẻ trong bài viết)", type: string }
          - { name: ten, label: Tên thẻ, type: string }
          - { name: moTa, label: Mô tả, type: text }
          - { name: anh, label: Ảnh, type: image }
          - { name: moTaAnh, label: Tả ảnh, type: string }
      - { name: hienThuToiNay, label: "Hiện phần 'thử tối nay' (trên trang này và cuối các bài)", type: boolean }
      - { name: thuToiNayGiaiThich, label: "Dòng giải thích phần 'thử tối nay'", type: text }
      - { name: viDuThuToiNay, label: "Ví dụ 'thử tối nay' trên trang", type: text }

  - name: trang-ke
    label: "📄 Trang Một chuyện thôi mẹ! — video, sách, ngôi làng"
    type: file
    path: src/_data/motChuyen.json
    format: json
    fields:
      - { name: loiMoDau, label: Lời mở đầu, type: text }
      - name: videos
        label: Truyện kể trên YouTube (thêm tập nào, hiện tập đó)
        type: object
        list: true
        fields:
          - { name: ten, label: Tên truyện, type: string }
          - { name: link, label: Link YouTube, type: string }
          - { name: ghiChu, label: "Dòng nhỏ (vd: 5 phút · cho bé sợ tối)", type: string }
          - { name: anh, label: "Ảnh bìa video (có thể bỏ trống)", type: image }
      - name: sach
        label: Bộ sách Cappu & Lucia
        type: object
        fields:
          - { name: tenBo, label: Tên bộ sách, type: string }
          - { name: nxb, label: Nhà xuất bản, type: string }
          - { name: tacGia, label: Dòng tác giả, type: string }
          - { name: trangThai, label: "Con dấu trạng thái (vd: sắp phát hành · cuối 2026 — bỏ trống để ẩn)", type: string }
          - { name: ghiChu, label: "Dòng viết tay dưới kệ sách (bỏ trống để ẩn)", type: string }
          - { name: sapCo, label: Dòng 'sắp có thêm', type: string }
          - name: cuon
            label: Từng cuốn
            type: object
            list: true
            fields:
              - { name: ten, label: Tên sách, type: string }
              - { name: noiSo, label: Nỗi sợ, type: string }
              - { name: moTa, label: Mô tả, type: text }
              - { name: bia, label: Bìa, type: image }
              - { name: linkMua, label: "Link mua sách (có link mới hiện nút Mua)", type: string }
      - name: ngoiLang
        label: Ngôi làng
        type: object
        fields:
          - { name: tieuDe, label: "Tiêu đề (*chữ nghiêng* giữa hai dấu sao)", type: string }
          - { name: moTa, label: Mô tả, type: text }

  - name: trang-xuong
    label: "📄 Trang Ở xưởng May — các món"
    type: file
    path: src/_data/xuong.json
    format: json
    fields:
      - { name: loiMoDau, label: Lời mở đầu, type: text }
      - { name: ghiLe, label: Câu viết tay bên phải, type: string }
      - name: banMay
        label: Ảnh 'trên bàn may hôm nay'
        type: object
        list: true
        fields:
          - { name: anh, label: Ảnh, type: image }
          - { name: moTa, label: Tả ảnh, type: string }
      - { name: banMayGhiChu, label: Dòng viết tay cạnh ảnh, type: string }
      - name: daXong
        label: Đã may xong
        type: object
        list: true
        fields: &mon
          - { name: trangThai, label: "Trạng thái (dòng viết tay trên thẻ)", type: string }
          - { name: loai, label: "Loại (vd: Khoá học video · 14 tập)", type: string }
          - { name: ten, label: Tên món, type: string }
          - { name: moTa, label: Mô tả, type: text }
          - { name: gia, label: "Giá (với Emotion Course, giá này dùng cho cả trang khoá học và thanh toán)", type: string }
          - { name: giaGhiChu, label: Dòng nhỏ dưới giá, type: string }
          - { name: ghiTay, label: "Dòng viết tay thay cho giá (nếu chưa có giá)", type: string }
          - { name: nutChu, label: Chữ trên nút, type: string }
          - { name: nutLink, label: "Nút dẫn tới đâu (bỏ trống để ẩn nút)", type: string }
          - { name: nutPhu, label: Nút viền (thay vì nút đặc), type: boolean }
          - { name: mauDa, label: "Thẻ màu đá (dành cho sách Cappu & Lucia)", type: boolean }
          - { name: tenNghieng, label: Tên in nghiêng, type: boolean }
          - name: bia
            label: Ảnh bìa nhỏ trên thẻ
            type: object
            list: true
            fields:
              - { name: anh, label: Ảnh, type: image }
              - { name: moTa, label: Tả ảnh, type: string }
      - name: dangMay
        label: Đang trên bàn may
        type: object
        list: true
        fields: *mon
      - name: baoTin
        label: Phần báo tin (email)
        type: object
        fields:
          - { name: tieuDe, label: "Tiêu đề (*chữ nghiêng* giữa hai dấu sao)", type: string }
          - { name: loi, label: Lời mời, type: text }
      - name: nguoiMay
        label: Người ngồi may
        type: object
        fields:
          - { name: anh, label: Ảnh, type: image }
          - { name: moTaAnh, label: Tả ảnh, type: string }
          - { name: chuThich, label: Chú thích ảnh, type: string }
          - { name: tieuDe, label: "Tiêu đề (*chữ nghiêng* giữa hai dấu sao)", type: string }
          - { name: loi, label: Đoạn giới thiệu (cách đoạn bằng một dòng trống), type: text }

  - name: ve-may
    label: "📄 Trang Về May"
    type: file
    path: src/ve-may.md
    fields:
      - { name: layout, type: string, hidden: true, default: page.njk }
      - { name: permalink, type: string, hidden: true, default: /ve-may/ }
      - { name: title, label: Tiêu đề, type: string }
      - { name: kicker, label: Dòng nhỏ phía trên, type: string }
      - { name: photo, label: Ảnh, type: image }
      - { name: photoAlt, label: Tả ảnh, type: string }
      - { name: photoCaption, label: Chú thích ảnh, type: string }
      - { name: signoff, label: Lời ký cuối, type: string }
      - { name: description, label: Mô tả (cho Google), type: text }
      - { name: body, label: Nội dung, type: rich-text }

  # ---------- CÀI ĐẶT ----------
  - name: settings
    label: "⚙️ Cài đặt: link mạng xã hội, email, chuyển khoản"
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: url, type: string, hidden: true }
      - { name: description, label: Mô tả trang (hiện trên Google), type: text }
      - name: social
        label: Mạng xã hội (dán link đầy đủ; bỏ trống thì nút tự ẩn)
        type: object
        fields:
          - { name: tiktok, label: TikTok, type: string }
          - { name: facebook, label: Facebook, type: string }
          - { name: youtube, label: YouTube, type: string }
      - name: email
        label: Form nhận email (MailerLite)
        type: object
        fields:
          - { name: formAction, label: Địa chỉ form chung, type: string }
          - { name: quaTangFormAction, label: "Địa chỉ form cuốn nhỏ miễn phí (bỏ trống = dùng form chung)", type: string }
      - { name: contactEmail, label: Email liên hệ, type: string }
      - { name: courseOldPrice, label: Giá gốc Emotion Course (gạch ngang), type: string }
      - { name: bankName, label: Ngân hàng, type: string }
      - { name: bankAccountName, label: Chủ tài khoản, type: string }
      - { name: bankAccountNumber, label: "Số tài khoản (có số này thì nút mua mới hiện)", type: string }
      - { name: bankVietQrId, label: "Mã ngân hàng cho VietQR (vd: VCB, TCB, MB…) — có thì hiện mã QR", type: string }
      - name: nav
        type: object
        list: true
        hidden: true
        fields:
          - { name: key, type: string }
          - { name: name, type: string }
          - { name: url, type: string }
          - { name: sub, type: string }
